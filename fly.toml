# Fly.io config — deploy with: fly deploy
app = "esther-rent-collector"
primary_region = "sin"

[build]
  # uses the repo's multi-stage Dockerfile

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
